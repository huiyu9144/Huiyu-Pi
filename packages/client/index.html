<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content`: when the on-screen
         keyboard appears on iOS / Android, shrink the visual viewport
         (i.e. take the keyboard's space out of the layout) instead of
         the default `resizes-visual` which leaves layout untouched and
         lets the keyboard overlay the page. The chat input lives at
         the bottom of a flex column, so this lets it ride above the
         keyboard automatically — no JS / visualViewport handling
         needed. Safe on desktop (no keyboard, no effect). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Huiyu Pi" />
    <link rel="icon" type="image/png" href="/icons/logo-rounded.png" />
    <link rel="apple-touch-icon" href="/icons/logo-rounded.png" />
    <title>Huiyu Pi — WebUI for the Pi Coding Agent</title>
    <meta name="description" content="Self-hosted browser workbench for the pi coding agent. Chat with AI, browse files, run a terminal, review diffs — a webui frontend for pi, pi-forge, and the coding agent ecosystem." />
    <meta name="keywords" content="pi, pi-forge, webui, coding agent, ai agent, self-hosted, local ai, code assistant, terminal, ide, browser ide, claude, openai, deepseek, anthropic" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Huiyu Pi — WebUI for the Pi Coding Agent" />
    <meta property="og:description" content="Self-hosted browser workbench for the pi coding agent. Chat with AI, browse files, run a terminal, review diffs — a webui frontend for pi, pi-forge, and the coding agent ecosystem." />
    <meta property="og:site_name" content="Huiyu Pi" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Huiyu Pi — WebUI for the Pi Coding Agent" />
    <meta name="twitter:description" content="Self-hosted browser workbench for the pi coding agent. Chat with AI, browse files, run a terminal, review diffs — a webui frontend for pi, pi-forge, and the coding agent ecosystem." />
  </head>

</html>
