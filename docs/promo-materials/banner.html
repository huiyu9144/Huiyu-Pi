<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>Huiyu Pi - Banner</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 200px;
        overflow: hidden;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #0a0a0a;
        color: #fff;
      }

      .banner {
        width: 1200px;
        height: 200px;
        position: relative;
        display: flex;
        align-items: center;
        padding: 0 80px;
        overflow: hidden;
      }

      .bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          90deg,
          rgba(59, 130, 246, 0.1) 0%,
          rgba(139, 92, 246, 0.1) 50%,
          rgba(6, 182, 212, 0.1) 100%
        );
        z-index: 0;
      }

      .bg-pattern {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image:
          radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 80% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%);
        z-index: 0;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 40px;
        width: 100%;
      }

      .left-section {
        display: flex;
        align-items: center;
        gap: 24px;
        flex-shrink: 0;
      }

      .logo {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        object-fit: cover;
        box-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
      }

      .brand-section {
        display: flex;
        flex-direction: column;
      }

      .brand {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -1px;
        background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.1;
      }

      .tagline {
        font-size: 14px;
        color: #64748b;
        margin-top: 4px;
      }

      .divider {
        width: 1px;
        height: 60px;
        background: rgba(255, 255, 255, 0.1);
        flex-shrink: 0;
      }

      .center-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .headline {
        font-size: 24px;
        font-weight: 700;
        color: #e2e8f0;
        line-height: 1.3;
      }

      .headline .highlight {
        color: #4ade80;
        font-weight: 800;
      }

      .features {
        display: flex;
        gap: 24px;
      }

      .feature {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #94a3b8;
      }

      .feature-icon {
        font-size: 16px;
      }

      .right-section {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
        flex-shrink: 0;
      }

      .cta-button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 14px 28px;
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        text-decoration: none;
        box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
      }

      .link {
        font-family: "JetBrains Mono", monospace;
        font-size: 13px;
        color: #60a5fa;
      }

      .dot-accent {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #3b82f6;
        opacity: 0.4;
      }
      .dot-1 {
        top: 20px;
        left: 20px;
      }
      .dot-2 {
        bottom: 20px;
        right: 20px;
        width: 4px;
        height: 4px;
        background: #8b5cf6;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="bg-gradient"></div>
      <div class="bg-pattern"></div>

      <div class="dot-accent dot-1"></div>
      <div class="dot-accent dot-2"></div>

      <div class="content">
        <div class="left-section">
          <img class="logo" src="../images/logo-rounded.png" alt="Huiyu Pi" />
          <div class="brand-section">
            <div class="brand">Huiyu Pi</div>
            <div class="tagline">零上下文 AI 编程助手</div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="center-section">
          <div class="headline">
            上下文从 <span class="highlight">~20K</span> 压缩到接近 <span class="highlight">0</span>
          </div>
          <div class="features">
            <div class="feature">
              <span class="feature-icon">⚡</span>
              <span>更快响应</span>
            </div>
            <div class="feature">
              <span class="feature-icon">💰</span>
              <span>成本降低 90%+</span>
            </div>
            <div class="feature">
              <span class="feature-icon">🧠</span>
              <span>AI 更专注</span>
            </div>
            <div class="feature">
              <span class="feature-icon">🔒</span>
              <span>100% 本地</span>
            </div>
          </div>
        </div>

        <div class="right-section">
          <div class="cta-button">
            <span>🚀</span>
            <span>立即体验</span>
          </div>
          <div class="link">npx huiyu-pi</div>
        </div>
      </div>
    </div>
  </body>
</html>
