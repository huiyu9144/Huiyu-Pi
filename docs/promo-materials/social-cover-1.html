<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>Huiyu Pi - Social Cover 1</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #0a0a0a;
        color: #fff;
      }

      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 80px 100px;
        overflow: hidden;
      }

      .bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(
            ellipse 800px 600px at 20% 50%,
            rgba(59, 130, 246, 0.08) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 600px 400px at 80% 30%,
            rgba(139, 92, 246, 0.06) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 500px 500px at 60% 80%,
            rgba(6, 182, 212, 0.04) 0%,
            transparent 70%
          );
        z-index: 0;
      }

      .content {
        position: relative;
        z-index: 1;
      }

      .top-row {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-bottom: 40px;
      }

      .logo {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        flex-shrink: 0;
        box-shadow: 0 0 40px rgba(59, 130, 246, 0.3);
        object-fit: cover;
      }

      .brand {
        font-size: 52px;
        font-weight: 800;
        letter-spacing: -1.5px;
        background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1.1;
      }

      .tagline {
        font-size: 24px;
        font-weight: 400;
        color: #94a3b8;
        margin-bottom: 36px;
        line-height: 1.5;
        max-width: 900px;
      }

      .tagline strong {
        color: #60a5fa;
        font-weight: 600;
      }

      .tagline .highlight {
        color: #4ade80;
        font-weight: 700;
      }

      .badges {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 24px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        font-family: "JetBrains Mono", monospace;
        border: 1px solid rgba(255, 255, 255, 0.08);
        background: rgba(255, 255, 255, 0.04);
        color: #e2e8f0;
      }

      .badge .icon {
        font-size: 20px;
      }

      .badge.blue {
        border-color: rgba(59, 130, 246, 0.3);
        color: #60a5fa;
      }
      .badge.purple {
        border-color: rgba(139, 92, 246, 0.3);
        color: #a78bfa;
      }
      .badge.cyan {
        border-color: rgba(6, 182, 212, 0.3);
        color: #22d3ee;
      }
      .badge.green {
        border-color: rgba(34, 197, 94, 0.3);
        color: #4ade80;
      }

      .corner-accent {
        position: absolute;
        bottom: 40px;
        right: 80px;
        font-size: 15px;
        color: rgba(255, 255, 255, 0.2);
        font-family: "JetBrains Mono", monospace;
        z-index: 1;
        text-align: right;
        line-height: 1.6;
      }

      .dot-accent {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #3b82f6;
        opacity: 0.6;
      }
      .dot-1 {
        top: 60px;
        right: 120px;
      }
      .dot-2 {
        top: 140px;
        right: 200px;
        width: 4px;
        height: 4px;
        background: #8b5cf6;
      }
      .dot-3 {
        bottom: 100px;
        left: 60px;
        width: 5px;
        height: 5px;
        background: #06b6d4;
      }
      .dot-4 {
        top: 200px;
        left: 150px;
        width: 3px;
        height: 3px;
        background: #f472b6;
      }

      .feature-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-top: 40px;
      }

      .feature-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
      }

      .feature-icon {
        font-size: 24px;
      }

      .feature-text {
        font-size: 14px;
        font-weight: 500;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bg-gradient"></div>

      <div class="dot-accent dot-1"></div>
      <div class="dot-accent dot-2"></div>
      <div class="dot-accent dot-3"></div>
      <div class="dot-accent dot-4"></div>

      <div class="content">
        <div class="top-row">
          <img class="logo" src="../images/logo-rounded.png" alt="Huiyu Pi" />
          <div class="brand">Huiyu Pi</div>
        </div>

        <div class="tagline">
          零上下文的本地 AI 编程助手 WebUI<br />
          比 Codex/Claude Code <span class="highlight">快数倍</span>，完全自托管
        </div>

        <div class="badges">
          <div class="badge blue"><span class="icon">🧠</span> Multi-LLM</div>
          <div class="badge purple"><span class="icon">📁</span> Full IDE</div>
          <div class="badge cyan"><span class="icon">🐳</span> Docker</div>
          <div class="badge green"><span class="icon">🔓</span> MIT License</div>
        </div>

        <div class="feature-grid">
          <div class="feature-item">
            <span class="feature-icon">⚡</span>
            <span class="feature-text">~500 tokens</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">🔒</span>
            <span class="feature-text">100% Local</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">🚀</span>
            <span class="feature-text">npx 一键启动</span>
          </div>
          <div class="feature-item">
            <span class="feature-icon">📱</span>
            <span class="feature-text">PWA 支持</span>
          </div>
        </div>
      </div>

      <div class="corner-accent">
        www.huiyu.ai<br />
        github.com/huiyu9144/Huiyu-Pi
      </div>
    </div>
  </body>
</html>
