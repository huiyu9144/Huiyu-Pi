<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>Huiyu Pi - Social Cover 3 (Comparison)</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #0a0a0a;
        color: #fff;
      }

      .card {
        width: 1200px;
        height: 630px;
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 60px 80px;
        overflow: hidden;
      }

      .bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: radial-gradient(
          ellipse 500px 400px at 50% 50%,
          rgba(59, 130, 246, 0.06) 0%,
          transparent 70%
        );
        z-index: 0;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 40px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .logo {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        object-fit: cover;
      }

      .brand-name {
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -1px;
        background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .vs-badge {
        padding: 8px 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        color: #94a3b8;
      }

      .comparison-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        flex: 1;
      }

      .tool-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      .tool-card.huiyu {
        background: rgba(34, 197, 94, 0.08);
        border-color: rgba(34, 197, 94, 0.3);
        box-shadow: 0 0 40px rgba(34, 197, 94, 0.1);
      }

      .tool-card.huiyu::before {
        content: "⭐ 推荐";
        position: absolute;
        top: -10px;
        right: 20px;
        background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        color: #fff;
        padding: 4px 12px;
        border-radius: 8px;
        font-size: 12px;
        font-weight: 600;
      }

      .tool-name {
        font-size: 18px;
        font-weight: 700;
        color: #e2e8f0;
        margin-bottom: 16px;
      }

      .tool-card.huiyu .tool-name {
        color: #4ade80;
      }

      .metric {
        margin-bottom: 16px;
      }

      .metric-label {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 6px;
      }

      .metric-value {
        font-size: 24px;
        font-weight: 800;
        font-family: "JetBrains Mono", monospace;
        color: #e2e8f0;
      }

      .tool-card.huiyu .metric-value {
        color: #4ade80;
      }

      .metric-bar {
        height: 6px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 3px;
        margin-top: 8px;
        overflow: hidden;
      }

      .metric-fill {
        height: 100%;
        border-radius: 3px;
      }

      .metric-fill.red {
        background: linear-gradient(90deg, #ef4444, #dc2626);
      }
      .metric-fill.orange {
        background: linear-gradient(90deg, #f97316, #ea580c);
      }
      .metric-fill.yellow {
        background: linear-gradient(90deg, #eab308, #ca8a04);
      }
      .metric-fill.green {
        background: linear-gradient(90deg, #22c55e, #16a34a);
      }

      .feature-list {
        margin-top: auto;
      }

      .feature-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        font-size: 13px;
        color: #94a3b8;
      }

      .feature-item .check {
        color: #4ade80;
      }

      .feature-item .cross {
        color: #ef4444;
      }

      .footer {
        margin-top: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .footer-text {
        font-size: 14px;
        color: #64748b;
      }

      .footer-link {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        color: #60a5fa;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bg-gradient"></div>

      <div class="content">
        <div class="header">
          <div class="brand">
            <img class="logo" src="../images/logo-rounded.png" alt="Huiyu Pi" />
            <div class="brand-name">Huiyu Pi</div>
          </div>
          <div class="vs-badge">vs 其他 AI 编程工具</div>
        </div>

        <div class="comparison-grid">
          <div class="tool-card">
            <div class="tool-name">Codex / Claude Code</div>
            <div class="metric">
              <div class="metric-label">上下文大小</div>
              <div class="metric-value">~15K</div>
              <div class="metric-bar">
                <div class="metric-fill red" style="width: 75%"></div>
              </div>
            </div>
            <div class="feature-list">
              <div class="feature-item"><span class="cross">✗</span> 绑定单一 LLM</div>
              <div class="feature-item"><span class="cross">✗</span> 无 WebUI</div>
              <div class="feature-item"><span class="cross">✗</span> 数据到云端</div>
            </div>
          </div>

          <div class="tool-card">
            <div class="tool-name">Cline</div>
            <div class="metric">
              <div class="metric-label">上下文大小</div>
              <div class="metric-value">~8K</div>
              <div class="metric-bar">
                <div class="metric-fill orange" style="width: 45%"></div>
              </div>
            </div>
            <div class="feature-list">
              <div class="feature-item"><span class="check">✓</span> 多 LLM 支持</div>
              <div class="feature-item"><span class="cross">✗</span> VS Code 扩展</div>
              <div class="feature-item"><span class="cross">✗</span> 无移动端</div>
            </div>
          </div>

          <div class="tool-card">
            <div class="tool-name">Aider</div>
            <div class="metric">
              <div class="metric-label">上下文大小</div>
              <div class="metric-value">~5K</div>
              <div class="metric-bar">
                <div class="metric-fill yellow" style="width: 30%"></div>
              </div>
            </div>
            <div class="feature-list">
              <div class="feature-item"><span class="check">✓</span> 多 LLM 支持</div>
              <div class="feature-item"><span class="cross">✗</span> 终端 CLI</div>
              <div class="feature-item"><span class="cross">✗</span> 无 WebUI</div>
            </div>
          </div>

          <div class="tool-card huiyu">
            <div class="tool-name">Huiyu Pi</div>
            <div class="metric">
              <div class="metric-label">上下文大小</div>
              <div class="metric-value">~500</div>
              <div class="metric-bar">
                <div class="metric-fill green" style="width: 3%"></div>
              </div>
            </div>
            <div class="feature-list">
              <div class="feature-item"><span class="check">✓</span> 10+ LLM 支持</div>
              <div class="feature-item"><span class="check">✓</span> 浏览器 WebUI</div>
              <div class="feature-item"><span class="check">✓</span> 100% 本地</div>
            </div>
          </div>
        </div>

        <div class="footer">
          <div class="footer-text">零上下文 = 更快响应 + 更低成本 + AI 更专注</div>
          <div class="footer-link">github.com/huiyu9144/Huiyu-Pi</div>
        </div>
      </div>
    </div>
  </body>
</html>
