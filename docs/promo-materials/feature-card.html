<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=800" />
    <title>Huiyu Pi - Feature Card</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 800px;
        height: 800px;
        overflow: hidden;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #0a0a0a;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .card {
        width: 720px;
        height: 720px;
        position: relative;
        display: flex;
        flex-direction: column;
        padding: 60px;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.03) 0%,
          rgba(255, 255, 255, 0.01) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 32px;
      }

      .bg-gradient {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          radial-gradient(
            ellipse 400px 300px at 20% 20%,
            rgba(59, 130, 246, 0.08) 0%,
            transparent 70%
          ),
          radial-gradient(
            ellipse 300px 300px at 80% 80%,
            rgba(139, 92, 246, 0.06) 0%,
            transparent 70%
          );
        z-index: 0;
        border-radius: 32px;
      }

      .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 40px;
      }

      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        object-fit: cover;
        box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
      }

      .brand {
        font-size: 36px;
        font-weight: 800;
        letter-spacing: -1px;
        background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .feature-title {
        font-size: 48px;
        font-weight: 800;
        line-height: 1.2;
        margin-bottom: 24px;
        background: linear-gradient(135deg, #fff 0%, #e2e8f0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .feature-desc {
        font-size: 20px;
        color: #94a3b8;
        line-height: 1.6;
        margin-bottom: 40px;
        flex: 1;
      }

      .feature-desc .highlight {
        color: #4ade80;
        font-weight: 600;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 40px;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 24px;
        text-align: center;
      }

      .stat-icon {
        font-size: 32px;
        margin-bottom: 12px;
      }

      .stat-value {
        font-size: 28px;
        font-weight: 800;
        font-family: "JetBrains Mono", monospace;
        color: #e2e8f0;
        margin-bottom: 4px;
      }

      .stat-label {
        font-size: 13px;
        color: #64748b;
      }

      .cta-section {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .cta-text {
        font-size: 16px;
        color: #64748b;
      }

      .cta-link {
        font-family: "JetBrains Mono", monospace;
        font-size: 16px;
        color: #60a5fa;
        font-weight: 500;
      }

      .dot-accent {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #3b82f6;
        opacity: 0.4;
      }
      .dot-1 {
        top: 30px;
        right: 40px;
      }
      .dot-2 {
        bottom: 40px;
        left: 30px;
        width: 4px;
        height: 4px;
        background: #8b5cf6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bg-gradient"></div>

      <div class="dot-accent dot-1"></div>
      <div class="dot-accent dot-2"></div>

      <div class="content">
        <div class="header">
          <img class="logo" src="../images/logo-rounded.png" alt="Huiyu Pi" />
          <div class="brand">Huiyu Pi</div>
        </div>

        <div class="feature-title">
          零上下文<br />
          AI 编程助手
        </div>

        <div class="feature-desc">
          上下文从 <span class="highlight">~20K tokens</span> 压缩到接近
          <span class="highlight">0</span><br />
          AI 响应更快、成本更低、注意力更专注
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">⚡</div>
            <div class="stat-value">~500</div>
            <div class="stat-label">默认 Tokens</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">💰</div>
            <div class="stat-value">90%+</div>
            <div class="stat-label">成本节省</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🧠</div>
            <div class="stat-value">10+</div>
            <div class="stat-label">LLM 支持</div>
          </div>
        </div>

        <div class="cta-section">
          <div class="cta-text">完全免费 · 开源 · 自托管</div>
          <div class="cta-link">github.com/huiyu9144/Huiyu-Pi</div>
        </div>
      </div>
    </div>
  </body>
</html>
